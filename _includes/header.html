<header>
  <div class="topnav">
    <a
      class="brand"
      href="/"
      aria-label="Accueil — David Jegou, Étiomédecine Bretagne"
    >
      <img
        class="brand-mark"
        src="./assets/images/optimized/moebius-192.webp"
        srcset="./assets/images/optimized/moebius-96.webp 96w, ./assets/images/optimized/moebius-192.webp 192w, ./assets/images/optimized/moebius-288.webp 288w"
        sizes="(max-width: 520px) 62px, 76px"
        alt=""
        width="84"
        height="56"
      />
      <span class="brand-title">
        <span>Étiomédecine</span>
        <span>Bretagne</span>
      </span>
    </a>
    <nav>
      {% for link in site.data.navigation %}
      <a href="{{ link.url }}" title="{{ link.name }}">{{ link.name }}</a>
      {% endfor %}
    </nav>
    <div class="hamburger-lines" onclick="toggleMenu()">
      <span class="line line1" id="line1"></span>
      <span class="line line2" id="line2"></span>
      <span class="line line3" id="line3"></span>
    </div>
  </div>
  <div class="sandwitch-menu" id="myLinks">
    {% for link in site.data.navigation %}
    <a href="{{ link.url }}" title="{{ link.name }}">{{ link.name }}</a>
    {% endfor %}
  </div>
</header>
