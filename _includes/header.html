<header>
  <div class="topnav">
    <a href="/">
      <picture>
        <source
          media="(min-width: 360px)"
          srcset="./assets/images/moebius-transparent.svg"
        />
        <img
          src="./assets/images/moebius-transparent.svg"
          alt="anneau de moebius"
          width="auto"
          height="75"
        />
      </picture>
    </a>
    <p>Etiomédecine en Bretagne</p>
    <nav>
      {% for link in site.data.navigation %}
      <a href="{{ link.url }}" title="{{ link.name }}">{{ link.name }}</a>
      {% endfor %}
    </nav>
    <div class="hamburger-lines" onclick="toggleMenu()">
      <span class="line line1" id="line1"></span>
      <span class="line line2" id="line2"></span>
      <span class="line line3" id="line3"></span>
    </div>
  </div>
  <div class="sandwich-menu" id="myLinks">
    {% for link in site.data.navigation %}
    <a href="{{ link.url }}" title="{{ link.name }}">{{ link.name }}</a>
    {% endfor %}
  </div>
</header>
